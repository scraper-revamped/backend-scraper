steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/scraper-app:$COMMIT_SHA', '.']
  
  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/scraper-app:$COMMIT_SHA']

  # 3. Deploy to Cloud Run with Custom Settings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'scraper-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/scraper-app:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--service-account'
      - 'rfp-scraper@diagflow-438514.iam.gserviceaccount.com'
      - '--allow-unauthenticated'
      
      # --- NEW ARGUMENTS BELOW ---
      
      # 1. Memory (Increase this if Chrome crashes with "Aw Snap" or Error 137)
      - '--memory'
      - '2Gi' 
      
      # 2. CPU (Selenium is heavy, 2 CPUs is recommended for speed)
      - '--cpu'
      - '2'
      
      # 3. Timeout (Increase this if the scrape takes longer than 5 mins)
      - '--timeout'
      - '60m'
      

images:
  - 'gcr.io/$PROJECT_ID/scraper-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY